<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Modelo conceitual de integração dual-axis do BioRemPP</title>
  <desc id="desc">HADEG e KEGG Degradation alimentam a junção funcional por KO. ToxCSM alimenta a junção química por CPD. Ambos convergem para o mesmo registro integrado do core BioRemPP.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#059669"/>
    </marker>
    <style>
      text { font-family: 'Georgia', 'Times New Roman', serif; fill: #0f172a; }
      .lane-title { font-size: 34px; font-weight: 700; }
      .lane-subtitle { font-size: 20px; fill: #475569; }
      .box-title { font-size: 26px; font-weight: 700; }
      .box-text { font-size: 19px; fill: #475569; }
      .core-title { font-size: 31px; font-weight: 700; }
      .core-subtitle { font-size: 21px; fill: #334155; }
      .hub-title { font-size: 18px; font-weight: 700; letter-spacing: 0.8px; }
      .hub-code { font-size: 26px; font-weight: 700; }
      .field { font-size: 22px; font-weight: 700; }
      .field-note { font-size: 17px; fill: #475569; }
      .note { font-size: 20px; fill: #334155; }
      .label { font-size: 18px; fill: #475569; }
      .source-box { rx: 22; ry: 22; fill: #ffffff; stroke-width: 2.5; filter: url(#shadow); }
      .core-box { rx: 28; ry: 28; fill: #ffffff; stroke: #0f172a; stroke-width: 2.4; filter: url(#shadow); }
      .hub-box { rx: 20; ry: 20; fill: #ffffff; stroke-width: 2.3; filter: url(#shadow); }
      .field-box { rx: 14; ry: 14; stroke-width: 1.8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1120" fill="#ffffff"/>

  <rect x="90" y="70" width="1620" height="270" rx="34" ry="34" fill="#f4f9ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="90" y="650" width="1620" height="210" rx="34" ry="34" fill="#f4fcf7" stroke="#86efac" stroke-width="2"/>

  <text x="150" y="135" class="lane-title">Painel funcional</text>
  <text x="150" y="171" class="lane-subtitle">Evidência degradativa e metabolismo xenobiótico integrados por orthologs KEGG.</text>

  <text x="150" y="715" class="lane-title">Painel químico</text>
  <text x="150" y="751" class="lane-subtitle">Integração química por compostos KEGG com camada toxicológica derivada de ToxCSM.</text>

  <rect class="source-box" x="180" y="190" width="305" height="118" stroke="#2563eb"/>
  <text x="332" y="238" class="box-title" text-anchor="middle">HADEG</text>
  <text x="332" y="273" class="box-text" text-anchor="middle">genes, orthologs e vias</text>
  <text x="332" y="299" class="box-text" text-anchor="middle">de degradação especializada</text>

  <rect class="source-box" x="1315" y="190" width="315" height="118" stroke="#2563eb"/>
  <text x="1472" y="238" class="box-title" text-anchor="middle">KEGG Degradation</text>
  <text x="1472" y="273" class="box-text" text-anchor="middle">vias canônicas e relações</text>
  <text x="1472" y="299" class="box-text" text-anchor="middle">KO-EC-reaction de xenobióticos</text>

  <rect class="hub-box" x="790" y="180" width="220" height="92" stroke="#2563eb"/>
  <text x="900" y="215" class="hub-title" text-anchor="middle" fill="#1d4ed8">JUNÇÃO FUNCIONAL</text>
  <text x="900" y="249" class="hub-code" text-anchor="middle" fill="#1d4ed8">KO</text>

  <line x1="485" y1="249" x2="790" y2="226" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <line x1="1315" y1="249" x2="1010" y2="226" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>

  <rect class="core-box" x="500" y="390" width="800" height="250"/>
  <text x="900" y="452" class="core-title" text-anchor="middle">Core BioRemPP</text>
  <text x="900" y="490" class="core-subtitle" text-anchor="middle">mesmo registro integrado acessível por duas superfícies de junção</text>

  <rect x="590" y="535" width="120" height="70" class="field-box" fill="#ecfdf5" stroke="#10b981"/>
  <text x="650" y="578" class="field" text-anchor="middle" fill="#065f46">CPD</text>
  <text x="650" y="628" class="field-note" text-anchor="middle">estrutura química</text>

  <rect x="730" y="535" width="120" height="70" class="field-box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="790" y="578" class="field" text-anchor="middle" fill="#1d4ed8">KO</text>
  <text x="790" y="628" class="field-note" text-anchor="middle">ortholog funcional</text>

  <rect x="870" y="535" width="100" height="70" class="field-box" fill="#ffffff" stroke="#94a3b8"/>
  <text x="920" y="578" class="field" text-anchor="middle" fill="#334155">EC</text>
  <text x="920" y="628" class="field-note" text-anchor="middle">enzima</text>

  <rect x="990" y="535" width="155" height="70" class="field-box" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1067" y="578" class="field" text-anchor="middle" fill="#334155">Reaction</text>
  <text x="1067" y="628" class="field-note" text-anchor="middle">transformação</text>

  <rect x="1165" y="535" width="85" height="70" class="field-box" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1207" y="578" class="field" text-anchor="middle" fill="#334155">AG</text>
  <text x="1207" y="628" class="field-note" text-anchor="middle">código regulatório</text>

  <line x1="900" y1="272" x2="790" y2="535" stroke="#60a5fa" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#arrowBlue)"/>
  <text x="1020" y="430" class="label" fill="#1d4ed8">entrada funcional por KO</text>

  <rect class="hub-box" x="465" y="700" width="220" height="92" stroke="#059669"/>
  <text x="575" y="735" class="hub-title" text-anchor="middle" fill="#047857">JUNÇÃO QUÍMICA</text>
  <text x="575" y="769" class="hub-code" text-anchor="middle" fill="#047857">CPD</text>

  <rect class="source-box" x="1315" y="685" width="315" height="118" stroke="#059669"/>
  <text x="1472" y="733" class="box-title" text-anchor="middle">ToxCSM</text>
  <text x="1472" y="768" class="box-text" text-anchor="middle">predições QSAR, SMILES e</text>
  <text x="1472" y="794" class="box-text" text-anchor="middle">camada toxicológica</text>

  <line x1="1315" y1="744" x2="685" y2="744" stroke="#059669" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <line x1="575" y1="700" x2="650" y2="605" stroke="#34d399" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#arrowGreen)"/>
  <text x="780" y="730" class="label" fill="#047857">entrada química por CPD</text>

  <line x1="300" y1="930" x2="1500" y2="930" stroke="#cbd5e1" stroke-width="2"/>
  <text x="900" y="985" class="note" text-anchor="middle">KO e CPD operam como superfícies de junção de primeira classe para o mesmo registro integrado do banco.</text>
  <text x="900" y="1020" class="note" text-anchor="middle">Consultas podem entrar pelo eixo funcional ou pelo eixo químico sem alterar o contrato público do core.</text>
</svg>
